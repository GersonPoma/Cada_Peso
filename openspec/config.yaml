schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  Proyecto: clon de YNAB (presupuesto personal base cero). Monorepo con /backend
  (Spring Boot 4 + Java 21 + Maven, packaging jar, configuración en .properties) y
  /frontend (Angular standalone components + signals, sin NgModules, sin SSR).
  Backend organizado por feature de negocio bajo com.presupuesto; infraestructura
  transversal (EntidadBase, excepciones + ProblemDetail, SecurityConfig) en comun/.
  Persistencia en PostgreSQL vía Hibernate (ddl-auto=update, sin Flyway/Liquibase).
  Seguridad JWT con jjwt (io.jsonwebtoken), API stateless.
  Todos los artefactos de OpenSpec (proposal, specs, design, tasks) se escriben en
  español. Nomenclatura: dominio en español, sufijos técnicos en inglés, sin tildes
  ni ñ en nombres de código. Dinero representado siempre como long en milésimas.
  Límite de línea de 100 columnas en todo el monorepo vía .editorconfig (único, en
  la raíz) y, en /frontend, Prettier (printWidth 100, singleQuote true). Commits
  convencionales en español.
  Estructura obligatoria de toda feature del backend (sin excepciones, también para
  cuentas, categorías, transacciones y las que sigan): com.presupuesto.<feature> con
  los subpaquetes controller, service, repository, entity, dto/request, dto/response y
  validacion, solo los que la feature necesite y ninguna clase en la raíz de la feature
  ni de dto/. Mapeo manual sin MapStruct: los records de dto/response tienen un método
  estático desde(...) y los services crean las entidades con sus builders de Lombok.
  Tests en el mismo subpaquete que la clase que prueban; los de HTTP en controller.
  comun/ (config, excepcion, seguridad, validacion) nunca importa una feature. Detalle y
  checklist en AGENTS.md, sección "Estructura obligatoria de una feature".

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
rules:
  specs:
    - Cada capacidad debe describirse con escenarios Dado/Cuando/Entonces.
  design:
    - Toda feature nueva, y todo change que cree o mueva clases del backend, ubica cada clase
      en su subpaquete según la estructura obligatoria de AGENTS.md ("Estructura obligatoria
      de una feature") e incluye en el design una tabla con el paquete completo
      (com.presupuesto.<feature>.<subpaquete>) de cada clase nueva o movida y de su test.
  tasks:
    - Cada tarea que crea o mueve una clase del backend indica su paquete completo y el de su
      test, según la estructura obligatoria de AGENTS.md ("Estructura obligatoria de una
      feature").

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
