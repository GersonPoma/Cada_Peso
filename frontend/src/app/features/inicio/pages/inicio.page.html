<main class="pagina">
  @if (cargando()) {
    <mat-progress-spinner mode="indeterminate" diameter="48" aria-label="Cargando" />
  } @else if (usuario(); as actual) {
    <h1 class="saludo">Hola, {{ actual.nombre }}</h1>
  } @else if (errorCarga(); as texto) {
    <p class="error" role="alert">{{ texto }}</p>
  }
</main>
