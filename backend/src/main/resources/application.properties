spring.application.name=cada-peso

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:presupuesto}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

jwt.secreto=${JWT_SECRET:cada-peso-secreto-solo-para-desarrollo-local-no-usar-en-produccion}
jwt.expiracion=24h

# Transacciones programadas: generacion al arrancar y una vez al dia (cron de Spring, UTC).
programadas.generacion.habilitada=true
programadas.generacion.cron=0 0 3 * * *

# Importacion de CSV: limites de la aplicacion (400 si se exceden). El archivo se procesa en
# memoria y nunca se guarda en disco.
importacion.max-bytes=2097152
importacion.max-filas=5000
# Techo del transporte multipart: debe ser mayor que importacion.max-bytes (asi el limite de la
# aplicacion da el mensaje preciso). El umbral igual al techo mantiene las partes en memoria
# (con 0, Tomcat las volcaria a un archivo temporal). Se suben juntos con importacion.max-bytes.
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4MB
spring.servlet.multipart.file-size-threshold=4MB
