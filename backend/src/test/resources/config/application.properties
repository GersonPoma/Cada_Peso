# Solo para los tests; se suma a src/main/resources/application.properties sin reemplazarlo
# (un application.properties en la raiz de test-classes lo taparia por completo).
# Cada contexto de Spring cacheado abre su propio pool: con el pool por defecto (10 conexiones)
# la suite agota max_connections de PostgreSQL ("demasiados clientes").
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
